#!/usr/bin/env python
# dynamic_reconfigure definition for the ROS 1 node. Parameter names, ranges and
# meanings mirror the core parameter table (core/src/config.cpp); the defaults
# below are overridden at start-up by the node's `~preset`.
PACKAGE = "lidar_obstacle_detector"

from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, bool_t, double_t, int_t, str_t

gen = ParameterGenerator()

det = gen.add_group("detector")
det_methods = gen.enum([gen.const("clustering", str_t, "clustering", "Model-free clustering (CPU): every cluster is a tracked box"),
                        gen.const("learning", str_t, "learning", "NVIDIA CUDA-CenterPoint only (needs a TensorRT build)"),
                        gen.const("fused", str_t, "fused", "CenterPoint objects + 2.5D pillars for everything else")],
                       "Detector")
det.add("detector_method", str_t, 0, "Detector", "clustering", edit_method=det_methods)
det.add("detector_score_threshold", double_t, 0, "Min score of learned detections", 0.3, 0.0, 1.0)
det.add("detector_model_dir", str_t, 0, "Directory of the learned detector models (empty = built-in)", "")
det.add("detector_sweeps", int_t, 0, "Scans accumulated as network input (needs tracking_frame)", 10, 1, 20)
det.add("fused_margin", double_t, 0, "fused: growth of learned boxes when absorbing clusters [m]", 0.3, 0.0, 3.0)
det.add("fused_min_overlap", double_t, 0, "fused: fraction of a cluster inside a learned box to absorb it", 0.5, 0.0, 1.0)
det.add("detector_engine_cache", str_t, 0, "Directory for TensorRT engine caches (empty = ~/.cache)", "")

pre = gen.add_group("preprocess")
pre.add("voxel_grid_size", double_t, 0, "Voxel grid leaf size [m], 0 disables downsampling", 0.2, 0.0, 1.0)
pre.add("roi_min_x", double_t, 0, "ROI min x [m]", -30.0, -200.0, 0.0)
pre.add("roi_max_x", double_t, 0, "ROI max x [m]", 70.0, 0.0, 200.0)
pre.add("roi_min_y", double_t, 0, "ROI min y [m]", -30.0, -200.0, 0.0)
pre.add("roi_max_y", double_t, 0, "ROI max y [m]", 30.0, 0.0, 200.0)
pre.add("roi_min_z", double_t, 0, "ROI min z [m]", -2.5, -10.0, 0.0)
pre.add("roi_max_z", double_t, 0, "ROI max z [m]", 1.0, -5.0, 10.0)
pre.add("remove_ego", bool_t, 0, "Remove points inside the ego-vehicle box", True)
pre.add("ego_min_x", double_t, 0, "Ego box min x [m]", -1.5, -20.0, 20.0)
pre.add("ego_max_x", double_t, 0, "Ego box max x [m]", 2.6, -20.0, 20.0)
pre.add("ego_min_y", double_t, 0, "Ego box min y [m]", -1.7, -20.0, 20.0)
pre.add("ego_max_y", double_t, 0, "Ego box max y [m]", 1.7, -20.0, 20.0)
pre.add("ego_min_z", double_t, 0, "Ego box min z [m]", -1.0, -10.0, 10.0)
pre.add("ego_max_z", double_t, 0, "Ego box max z [m]", -0.4, -10.0, 10.0)

ground = gen.add_group("ground")
ground_methods = gen.enum([gen.const("ransac", str_t, "ransac", "Tilt-constrained RANSAC plane"),
                           gen.const("patchworkpp", str_t, "patchworkpp", "Patchwork++")],
                          "Ground segmentation method")
ground.add("ground_method", str_t, 0, "Ground segmentation method", "patchworkpp", edit_method=ground_methods)
ground.add("ground_threshold", double_t, 0, "RANSAC plane distance threshold [m]", 0.3, 0.0, 2.0)
ground.add("ground_max_iterations", int_t, 0, "RANSAC iterations", 100, 1, 10000)
ground.add("ground_max_slope", double_t, 0, "RANSAC: max ground tilt [deg], 90 = unconstrained", 15.0, 0.0, 90.0)
ground.add("sensor_height", double_t, 0, "Patchwork++: lidar height above the ground [m]", 1.73, 0.0, 10.0)
ground.add("ground_refine", bool_t, 0, "Relabel points close to the local ground height as ground", True)
ground.add("ground_refine_threshold", double_t, 0, "Height above the local ground still counted as ground [m]", 0.2, 0.0, 1.0)

cluster = gen.add_group("clustering")
cluster_methods = gen.enum([gen.const("euclidean", str_t, "euclidean", "Fixed-radius Euclidean (PCL)"),
                            gen.const("adaptive", str_t, "adaptive", "Range-adaptive Euclidean"),
                            gen.const("bev_grid", str_t, "bev_grid", "BEV grid connected components")],
                           "Clustering method")
cluster.add("cluster_method", str_t, 0, "Clustering method", "bev_grid", edit_method=cluster_methods)
cluster.add("cluster_threshold", double_t, 0, "Cluster distance tolerance [m]", 0.6, 0.05, 5.0)
cluster.add("cluster_range_gain", double_t, 0, "Adaptive tolerance = max(threshold, gain * range)", 0.02, 0.0, 0.2)
cluster.add("cluster_cell_size", double_t, 0, "BEV grid cell size [m]", 0.25, 0.05, 2.0)
cluster.add("cluster_z_gap", double_t, 0, "BEV grid: split columns at vertical gaps > max(gap, 0.04 * range) [m], 0 = off", 0.8, 0.0, 5.0)
cluster.add("cluster_split_oversized", bool_t, 0, "Re-cluster oversized clusters with a tighter tolerance", True)
cluster.add("separate_structures", bool_t, 0, "Report oversized clusters as structures instead of objects", True)
cluster.add("object_max_length", double_t, 0, "Longer clusters are split or become structures [m]", 16.0, 1.0, 100.0)
cluster.add("object_max_width", double_t, 0, "Wider clusters are split or become structures [m]", 5.0, 0.5, 50.0)
cluster.add("cluster_track_guided", bool_t, 0, "Re-join / separate clusters using the predicted footprints of vehicle tracks", False)
cluster.add("cluster_track_guided_margin", double_t, 0, "Growth of the predicted track footprints [m]", 0.0, 0.0, 2.0)
cluster.add("cluster_min_size", int_t, 0, "Min points per cluster", 10, 1, 100000)
cluster.add("cluster_max_size", int_t, 0, "Max points per cluster", 5000, 1, 10000000)

box = gen.add_group("boxes")
box_methods = gen.enum([gen.const("aabb", str_t, "aabb", "Axis-aligned"),
                        gen.const("pca", str_t, "pca", "PCA (yaw only)"),
                        gen.const("lshape", str_t, "lshape", "L-shape fitting")],
                       "Bounding box method")
box.add("box_method", str_t, 0, "Bounding box method", "lshape", edit_method=box_methods)
box.add("lshape_angle_step", double_t, 0, "L-shape search step [deg]", 1.0, 0.1, 10.0)

track = gen.add_group("tracking")
track_costs = gen.enum([gen.const("center", str_t, "center", "Centre distance"),
                        gen.const("giou", str_t, "giou", "1 - BEV GIoU")],
                       "Association cost")
track.add("use_tracking", bool_t, 0, "Track obstacles across frames", True)
track.add("track_cost", str_t, 0, "Association cost", "giou", edit_method=track_costs)
track.add("track_max_distance", double_t, 0, "Association gate on centre distance [m]", 2.0, 0.1, 20.0)
track.add("track_min_giou", double_t, 0, "Association gate on GIoU", -0.5, -1.0, 1.0)
track.add("track_min_hits", int_t, 0, "Updates before a track is confirmed", 2, 1, 100)
track.add("track_max_age", double_t, 0, "Delete tracks not updated for this long [s]", 0.5, 0.0, 10.0)
track.add("track_accel_noise", double_t, 0, "Kalman process noise [m/s^2]", 3.0, 0.01, 50.0)
track.add("track_meas_noise", double_t, 0, "Kalman measurement noise [m]", 0.3, 0.01, 10.0)
track.add("track_size_smoothing", double_t, 0, "EMA weight of new size measurements", 0.3, 0.0, 1.0)
track.add("track_heading_from_motion", bool_t, 0, "Moving, stable tracks take their yaw from the velocity", True)
track.add("track_heading_min_speed", double_t, 0, "Min speed for heading from motion [m/s]", 2.0, 0.0, 50.0)
track.add("track_shape_completion", bool_t, 0, "Keep the track's full size for partially visible objects", True)
track.add("prediction_horizon", double_t, 0, "Predicted path length [s], 0 = off", 3.0, 0.0, 10.0)
track.add("prediction_step", double_t, 0, "Time between predicted poses [s]", 0.5, 0.05, 2.0)

occ = gen.add_group("occupancy")
occ.add("occupancy_enabled", bool_t, 0, "Compute the 2.5D pillars, the 2D occupancy grid and 3D occupied voxels", True)
occ.add("occupancy_resolution", double_t, 0, "2D occupancy grid / pillar cell size [m]", 0.2, 0.05, 2.0)
occ.add("occupancy_min_height", double_t, 0, "Obstacle points count from this height above ground [m]", 0.2, 0.0, 5.0)
occ.add("occupancy_max_height", double_t, 0, "... up to this height above ground [m]", 2.5, 0.0, 10.0)
occ.add("occupancy_voxel_size", double_t, 0, "3D occupied voxel size [m]", 0.2, 0.05, 2.0)
occ.add("pillar_memory", double_t, 0, "Fuse pillars over this many seconds (needs tracking_frame), 0 = off", 2.0, 0.0, 10.0)

exit(gen.generate(PACKAGE, "obstacle_detector", "obstacle_detector"))
